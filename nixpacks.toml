[phases.setup]
nixPkgs = ["python312", "gcc", "pkg-config", "mysql80", "postgresql", "portaudio"]

[phases.build]
cmds = [
    "cd backend && pip install -r requirements.txt",
    "cd backend && python manage.py collectstatic --noinput"
]

[start]
cmd = "cd backend && gunicorn server.wsgi --bind 0.0.0.0:$PORT"
